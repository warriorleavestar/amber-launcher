name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Amber.slnx

      - name: Build
        run: dotnet build Amber.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test Amber.Core.Tests -c Release --no-build

      # 界面自检（AMBER_SELFTEST）要真实窗口、联网下载游戏和启动 Java，CI 上不跑，发布前在本机跑 tools/run-selftest.ps1。

      - name: Publish (single file, ReadyToRun)
        run: dotnet publish Amber.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true -p:DebugType=none -o ../out/r2r

      - name: Publish (Native AOT)
        run: dotnet publish Amber.App -c Release -r win-x64 -p:PublishAot=true -p:DebugType=none -o ../out/aot

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amber-r2r
          path: out/r2r
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amber-aot
          path: out/aot
          if-no-files-found: error
